services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MOCK_LLM: ${MOCK_LLM:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENALEX_MAILTO: ${OPENALEX_MAILTO:-specresearch@example.com}
      DATABASE_URL: sqlite:////data/specresearch.db
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - specresearch-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  specresearch-data:
